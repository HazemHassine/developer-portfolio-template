<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <rect width="800" height="450" fill="#09090b" rx="8" stroke="#27272a" stroke-width="1"/>
  <rect x="0" y="0" width="800" height="36" fill="#121215" rx="8 8 0 0"/>
  <circle cx="20" cy="18" r="5" fill="#ef4444"/><circle cx="36" cy="18" r="5" fill="#f59e0b"/><circle cx="52" cy="18" r="5" fill="#22c55e"/>
  <text x="400" y="23" fill="#71717a" font-family="monospace" font-size="12" text-anchor="middle">hazemhassine.space — AI Assistant, Admin Studio &amp; Minigame</text>

  <!-- 3 Preview Boxes -->
  <!-- Box 1: AI Chat -->
  <g transform="translate(30, 60)">
    <rect x="0" y="0" width="230" height="350" rx="8" fill="#121215" stroke="#27272a"/>
    <rect x="0" y="0" width="230" height="34" rx="8 8 0 0" fill="#18181b"/>
    <text x="15" y="22" fill="#22c55e" font-family="monospace" font-size="11" font-weight="700">🤖 AI ASSISTANT</text>
    
    <rect x="12" y="50" width="160" height="44" rx="6" fill="#27272a"/>
    <text x="20" y="68" fill="#e4e4e7" font-family="sans-serif" font-size="10">Tell me about Hazem's</text>
    <text x="20" y="82" fill="#e4e4e7" font-family="sans-serif" font-size="10">recent full-stack work.</text>

    <rect x="40" y="110" width="178" height="64" rx="6" fill="#18181b" stroke="#27272a"/>
    <text x="48" y="128" fill="#a1a1aa" font-family="sans-serif" font-size="9">Hazem specializes in</text>
    <text x="48" y="142" fill="#a1a1aa" font-family="sans-serif" font-size="9">Next.js 16, React 19,</text>
    <text x="48" y="156" fill="#a1a1aa" font-family="sans-serif" font-size="9">and 3D web graphics...</text>
    <text x="15" y="325" fill="#71717a" font-family="monospace" font-size="10">Vercel AI SDK Integration</text>
  </g>

  <!-- Box 2: 404 Game -->
  <g transform="translate(285, 60)">
    <rect x="0" y="0" width="230" height="350" rx="8" fill="#121215" stroke="#27272a"/>
    <rect x="0" y="0" width="230" height="34" rx="8 8 0 0" fill="#18181b"/>
    <text x="15" y="22" fill="#eab308" font-family="monospace" font-size="11" font-weight="700">🎮 404 CYBER GRID</text>
    
    <!-- Mini game grid -->
    <rect x="15" y="50" width="200" height="190" rx="6" fill="#000000" stroke="#27272a"/>
    <text x="115" y="90" fill="#ef4444" font-family="monospace" font-size="16" font-weight="700" text-anchor="middle">404 // SIGNAL LOST</text>
    <text x="115" y="120" fill="#22c55e" font-family="monospace" font-size="12" text-anchor="middle">SCORE: 1,420</text>
    <rect x="75" y="145" width="80" height="26" rx="4" fill="#22c55e"/>
    <text x="115" y="162" fill="#000000" font-family="monospace" font-size="10" font-weight="700" text-anchor="middle">START GAME</text>
    
    <text x="15" y="275" fill="#ffffff" font-family="monospace" font-size="11" font-weight="600">Global Leaderboard</text>
    <text x="15" y="295" fill="#71717a" font-family="monospace" font-size="9">1. HAZEM — 4,820 PTS</text>
    <text x="15" y="310" fill="#71717a" font-family="monospace" font-size="9">2. GUEST — 3,110 PTS</text>
  </g>

  <!-- Box 3: Admin CMS -->
  <g transform="translate(540, 60)">
    <rect x="0" y="0" width="230" height="350" rx="8" fill="#121215" stroke="#27272a"/>
    <rect x="0" y="0" width="230" height="34" rx="8 8 0 0" fill="#18181b"/>
    <text x="15" y="22" fill="#3b82f6" font-family="monospace" font-size="11" font-weight="700">🔐 CMS &amp; TOTP 2FA</text>
    
    <rect x="15" y="50" width="200" height="34" rx="4" fill="#18181b" stroke="#27272a"/>
    <text x="25" y="72" fill="#a1a1aa" font-family="monospace" font-size="10">TOTP Auth Verified ✓</text>

    <text x="15" y="115" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="600">Content Studio</text>
    <text x="15" y="135" fill="#71717a" font-family="monospace" font-size="10">• Live Draft Previews</text>
    <text x="15" y="155" fill="#71717a" font-family="monospace" font-size="10">• Revision Rollback</text>
    <text x="15" y="175" fill="#71717a" font-family="monospace" font-size="10">• Markdown WYSIWYG</text>
    <text x="15" y="195" fill="#71717a" font-family="monospace" font-size="10">• Contact Inbox</text>
    <text x="15" y="215" fill="#71717a" font-family="monospace" font-size="10">• Media Uploads</text>

    <rect x="15" y="260" width="200" height="34" rx="4" fill="#22c55e" fill-opacity="0.1" stroke="#22c55e"/>
    <text x="115" y="282" fill="#22c55e" font-family="monospace" font-size="10" font-weight="700" text-anchor="middle">PUBLISH CHANGES</text>
  </g>
