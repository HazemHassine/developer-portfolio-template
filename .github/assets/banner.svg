    <rect x="195" y="0" width="180" height="42" rx="6" fill="#18181b" stroke="#27272a" />
    <text x="215" y="26" fill="#e4e4e7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500">🤖 AI Portfolio Bot</text>

    <rect x="390" y="0" width="180" height="42" rx="6" fill="#18181b" stroke="#27272a" />
    <text x="410" y="26" fill="#e4e4e7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500">⚡ Tailwind CSS 4</text>

    <rect x="585" y="0" width="190" height="42" rx="6" fill="#18181b" stroke="#27272a" />
    <text x="605" y="26" fill="#e4e4e7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500">🎮 404 Cyber Game</text>

