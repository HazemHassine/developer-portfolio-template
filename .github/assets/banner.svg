    Brutalist aesthetic, 3D interactive hero, AI chat assistant, Markdown blog,
  </text>
  <text x="80" y="288" fill="#a1a1aa" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="400">
