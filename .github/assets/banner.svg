<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09090b" />
      <stop offset="50%" stop-color="#0f0f13" />
      <stop offset="100%" stop-color="#18181b" />
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#27272a" stroke-width="1" stroke-opacity="0.3"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg-grad)" />
  <rect width="1200" height="630" fill="url(#grid)" />

  <!-- Frame border -->
  <rect x="40" y="40" width="1120" height="550" fill="none" stroke="#27272a" stroke-width="1.5" />
  
  <!-- Corner accents -->
  <path d="M 35 60 L 35 35 L 60 35" fill="none" stroke="#22c55e" stroke-width="3" />
  <path d="M 1140 35 L 1165 35 L 1165 60" fill="none" stroke="#22c55e" stroke-width="3" />
  <path d="M 35 570 L 35 595 L 60 595" fill="none" stroke="#22c55e" stroke-width="3" />
  <path d="M 1140 595 L 1165 595 L 1165 570" fill="none" stroke="#22c55e" stroke-width="3" />

  <!-- Top badge -->
  <rect x="80" y="80" width="200" height="32" rx="6" fill="#18181b" stroke="#27272a" stroke-width="1" />
