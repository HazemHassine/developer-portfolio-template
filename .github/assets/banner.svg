    <text x="28" y="40" fill="#22c55e" font-family="monospace" font-size="15" font-weight="700">LIVE DEMO ↗</text>
    <text x="160" y="40" fill="#ffffff" font-family="monospace" font-size="15" font-weight="600">https://developer-portfolio-template.hazemhassine.space/</text>
