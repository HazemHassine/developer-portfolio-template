    <text x="810" y="26" fill="#e4e4e7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500">🔐 Supabase CMS &amp; 2FA</text>
