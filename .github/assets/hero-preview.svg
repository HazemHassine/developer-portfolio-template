<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <rect width="800" height="450" fill="#09090b" rx="8" stroke="#27272a" stroke-width="1"/>
  <!-- Top bar -->
  <rect x="0" y="0" width="800" height="36" fill="#121215" rx="8 8 0 0"/>
  <circle cx="20" cy="18" r="5" fill="#ef4444"/>
  <circle cx="36" cy="18" r="5" fill="#f59e0b"/>
  <circle cx="52" cy="18" r="5" fill="#22c55e"/>
  <text x="400" y="23" fill="#71717a" font-family="monospace" font-size="12" text-anchor="middle">hazemhassine.space — Hero &amp; 3D Interactive Canvas</text>

  <!-- Content Layout -->
  <!-- Left Column -->
  <g transform="translate(40, 70)">
    <rect x="0" y="0" width="130" height="24" rx="4" fill="#18181b" stroke="#27272a"/>
    <circle cx="12" cy="12" r="3" fill="#22c55e"/>
    <text x="22" y="16" fill="#22c55e" font-family="monospace" font-size="10" font-weight="700">AVAILABLE FOR HIRE</text>

    <text x="0" y="65" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="34" font-weight="800">SOFTWARE</text>
    <text x="0" y="105" fill="#a1a1aa" font-family="-apple-system, sans-serif" font-size="34" font-weight="800">ENGINEER</text>
    
    <text x="0" y="145" fill="#71717a" font-family="monospace" font-size="12">Building high-impact web apps,</text>
    <text x="0" y="165" fill="#71717a" font-family="monospace" font-size="12">scalable APIs &amp; interactive 3D.</text>

    <!-- CTAs -->
    <rect x="0" y="200" width="130" height="38" rx="6" fill="#ffffff"/>
    <text x="65" y="224" fill="#000000" font-family="monospace" font-size="12" font-weight="700" text-anchor="middle">EXPLORE WORK ↓</text>
    
    <rect x="145" y="200" width="110" height="38" rx="6" fill="#18181b" stroke="#27272a"/>
    <text x="200" y="224" fill="#e4e4e7" font-family="monospace" font-size="12" font-weight="600" text-anchor="middle">GET IN TOUCH</text>
  </g>

  <!-- Right Column: 3D Canvas wireframe representation -->
  <g transform="translate(460, 80)">
    <rect x="0" y="0" width="300" height="300" rx="8" fill="#121215" stroke="#27272a" stroke-dasharray="4 4"/>
    <circle cx="150" cy="150" r="90" fill="none" stroke="#22c55e" stroke-width="1.5" stroke-opacity="0.4"/>
    <circle cx="150" cy="150" r="60" fill="none" stroke="#3b82f6" stroke-width="1.5" stroke-opacity="0.5"/>
    <circle cx="150" cy="150" r="30" fill="none" stroke="#a855f7" stroke-width="1.5" stroke-opacity="0.6"/>
    <!-- Wireframe poly shape -->
    <polygon points="150,70 215,115 215,185 150,230 85,185 85,115" fill="none" stroke="#22c55e" stroke-width="2"/>
    <line x1="150" y1="70" x2="150" y2="230" stroke="#22c55e" stroke-width="1" stroke-opacity="0.5"/>
    <line x1="85" y1="115" x2="215" y2="185" stroke="#22c55e" stroke-width="1" stroke-opacity="0.5"/>
    <line x1="85" y1="185" x2="215" y2="115" stroke="#22c55e" stroke-width="1" stroke-opacity="0.5"/>
    <text x="150" y="325" fill="#71717a" font-family="monospace" font-size="11" text-anchor="middle">Three.js / React Three Fiber 3D Canvas</text>
  </g>
</svg>
